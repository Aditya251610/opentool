version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: opentool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  server:
    build: ./apps/server
    ports:
      - "3001:3001"
    env_file: .env
    depends_on:
      - postgres
      - redis

  dashboard:
    build: ./apps/dashboard
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - server

volumes:
  pgdata:
