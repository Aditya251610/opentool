[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentool-sdk"
version = "0.1.1"
description = "Python SDK for the OpenTool MCP server — manage tools, auth, and API keys programmatically."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "OpenTool Contributors" }]
keywords = ["opentool", "mcp", "ai-tools", "oauth", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Aditya251610/opentool"
Repository = "https://github.com/Aditya251610/opentool"
Documentation = "https://github.com/Aditya251610/opentool"

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["opentool"]

[tool.mypy]
strict = true
python_version = "3.9"

[tool.pytest.ini_options]
asyncio_mode = "auto"
