    <line x1="200" y1="40" x2="200" y2="60"
          stroke="#06B6D4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="200" cy="36" r="5" fill="#06B6D4"/>

    <!-- Head -->
    <rect x="150" y="60" width="100" height="90"
          rx="16" fill="none" stroke="#06B6D4" stroke-width="3"/>

