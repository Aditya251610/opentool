name: CLI Release

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      npm_dist_tag:
        description: 'npm dist-tag to publish to'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - beta

permissions:
  contents: write
  id-token: write

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  # ── 1. Build & validate ──────────────────────────────────────────────
  build:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: cd packages/cli && pnpm build

      - name: Verify bin entry
        run: |
          set -euo pipefail
          head -1 packages/cli/dist/index.js | grep -q '#!/usr/bin/env node' \
            || (echo "Missing shebang in dist/index.js" && exit 1)
          echo "✓ Shebang present"

      - name: Verify version
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "Package version: ${PKG_VERSION}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
            if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
              echo "Version mismatch: package.json=${PKG_VERSION} tag=${TAG_VERSION}"
              exit 1
            fi
            echo "✓ Tag matches package version"
          fi

      - name: Pack tarball
        run: cd packages/cli && npm pack

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-tarball
          path: packages/cli/*.tgz
          if-no-files-found: error

  # ── 2. Publish to npm ────────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: cd packages/cli && pnpm build

      - name: Check if version is already published
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          PKG_NAME=$(node -p "require('./packages/cli/package.json').name")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published."
            exit 1
          fi
          echo "Publishing ${PKG_NAME}@${PKG_VERSION}"

      - name: Publish
        working-directory: packages/cli
        run: |
          DIST_TAG="${{ inputs.npm_dist_tag || 'latest' }}"
          npm publish --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 3. GitHub Release with tarball ───────────────────────────────────
  github-release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: cli-tarball
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: release-assets/*.tgz
          body: |
            ## Install

            ```bash
            npm i -g opentool-cli@${{ github.ref_name }}
            ```

            Or download the tarball below and install with:
            ```bash
            npm i -g ./opentool-cli-*.tgz
            ```
