name: Release Please

on:
  push:
    branches: [main]
    # Don't run on tag pushes
    tags-ignore: ['**']

permissions:
  contents: write
  pull-requests: write

# Only one release-please run at a time
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

    # ─── No publish jobs here! ────────────────────────────────
    # Publishing is handled by tag-triggered workflows:
    #   - publish-sdk.yml  → sdk-ts-v*, sdk-py-v* tags
    #   - cli-release.yml  → cli-v* tags
    #
    # Flow: push to main → release-please creates PR →
    #       merge PR → release-please creates tags →
    #       tags trigger publish workflows
