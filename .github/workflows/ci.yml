name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Build shared packages first
      - run: cd packages/tool-schema && pnpm build
      - run: cd packages/proto && pnpm build
      - run: cd packages/sdk/ts && pnpm build

      # Server typecheck
      - run: cd apps/server && npx prisma generate
      - run: cd apps/server && npx tsc --noEmit

      # CLI typecheck (depends on SDK build)
      - run: cd packages/cli && npx tsc --noEmit

      # Dashboard build (includes type check)
      - run: cd apps/dashboard && npx next build
        env:
          NEXTAUTH_SECRET: ci-dummy-secret
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_SERVER_URL: http://localhost:3001

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: cd packages/tool-schema && pnpm build
      - run: cd packages/proto && pnpm build
      - run: cd apps/server && pnpm lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: cd packages/tool-schema && pnpm build
      - run: cd packages/proto && pnpm build
      - run: cd apps/server && npx prisma generate
      - run: cd apps/server && pnpm test
      - run: cd packages/cli && pnpm test
      - run: cd packages/sdk/ts && pnpm test
