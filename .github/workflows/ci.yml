name: CI

on:
  push:
    branches: [main]
    # Don't run CI on tag pushes — those trigger publish workflows
    tags-ignore: ['**']
  pull_request:
    branches: [main]

# Skip CI for release-please version-bump commits
# (they only change CHANGELOG.md, package.json versions, etc.)
concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Gate: skip CI for release-please auto-commits
  check-skip:
    name: Check Skip
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == chore\(main\):\ release* ]]; then
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping CI — release-please auto-commit"
          else
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    name: TypeScript Check
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Build shared packages first
      - run: cd packages/tool-schema && pnpm build
      - run: cd packages/proto && pnpm build
      - run: cd packages/sdk/ts && pnpm build

      # Server typecheck
      - run: cd apps/server && npx prisma generate
      - run: cd apps/server && npx tsc --noEmit

      # CLI typecheck (depends on SDK build)
      - run: cd packages/cli && npx tsc --noEmit

      # Dashboard build (includes type check)
      - run: cd apps/dashboard && npx next build
        env:
          NEXTAUTH_SECRET: ci-dummy-secret
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_SERVER_URL: http://localhost:3001

  lint:
    name: Lint
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: cd packages/tool-schema && pnpm build
      - run: cd packages/proto && pnpm build
      - run: cd apps/server && pnpm lint

  test:
    name: Unit Tests
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: cd packages/tool-schema && pnpm build
      - run: cd packages/proto && pnpm build
      - run: cd apps/server && npx prisma generate
      - run: cd apps/server && pnpm test
      - run: cd packages/cli && pnpm test
      - run: cd packages/sdk/ts && pnpm test
