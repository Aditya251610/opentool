name: Release SDKs

on:
  push:
    tags:
      - 'sdk-ts-v*'
      - 'sdk-py-v*'

jobs:
  publish-ts-npm:
    if: startsWith(github.ref, 'refs/tags/sdk-ts-v')
    name: Publish TS SDK to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: cd packages/sdk/ts && pnpm install && pnpm build
      - run: cd packages/sdk/ts && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-ts-github:
    if: startsWith(github.ref, 'refs/tags/sdk-ts-v')
    name: Publish TS SDK to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@Aditya251610'
      - run: cd packages/sdk/ts && pnpm install && pnpm build
      - name: Publish to GitHub Packages
        working-directory: packages/sdk/ts
        run: |
          # Temporarily set name to GitHub scoped package
          node -e "
            const pkg = require('./package.json');
            pkg.name = '@Aditya251610/opentool-sdk';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-py:
    if: startsWith(github.ref, 'refs/tags/sdk-py-v')
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: cd packages/sdk/python && python -m build
      - run: cd packages/sdk/python && twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
